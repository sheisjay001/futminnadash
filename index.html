<style>

canvas{display:block}

let playerName='',playerFaculty='',playerDept='',money=0,upgrades={speed:0,jump:0};
try{
  playerName=localStorage.getItem('fd3Name')||'';
  playerFaculty=localStorage.getItem('fd3Fac')||'';
  playerDept=localStorage.getItem('fd3Dept')||'';
  money=+localStorage.getItem('fd3Money')||0;

}catch(e){}

  try{
    localStorage.setItem('fd3Money',money);
    localStorage.setItem('fd3Upg',JSON.stringify(upgrades));
  }catch(e){}
}
const API_BASE=window.BACKEND_URL||'https://futminnadash-backend.onrender.com/api';
async function saveScore(cgpa,timeRemaining,win){if(!playerName||!playerFaculty||!playerDept){console.warn('Cannot save score: missing player data');return}try{const res=await fetch(API_BASE+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:playerName,faculty:playerFaculty,department:playerDept,cgpa:cgpa,timeRemaining:timeRemaining,win:win,timestamp:Date.now()})});if(!res.ok)console.error('Save score failed:',res.status,res.statusText);else console.log('Score saved successfully')}catch(e){console.error('Failed to save score:',e)}}
async function getLeaderboard(faculty,dept){try{const params=new URLSearchParams();if(faculty)params.append('faculty',faculty);if(dept)params.append('department',dept);const res=await fetch(API_BASE+'/leaderboard?'+params);if(!res.ok){console.error('Leaderboard fetch failed:',res.status,res.statusText);return[]}const data=await res.json();return Array.isArray(data)?data:[]}catch(e){console.error('Failed to get leaderboard:',e);return[]}}
const ZONES=[[-100,'Gidan Kwano'],[-200,'Gidan Kwano Bus Park'],[-300,'Bosso Campus'],[-400,'Bosso Bus Park'],[-1e9,'Lecture Hall']];
const GOAL=-500,TIME0=180,hallW=80,hallH=25,hallD=30;
/* ---------- sound ---------- */
let AC,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,f2){if(muted||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
const sfx={good:()=>tone(660,.12,'triangle',.18,990),hit:()=>tone(150,.3,'sawtooth',.2,55),warn:()=>{tone(300,.2,'square',.08);setTimeout(()=>tone(300,.2,'square',.08),250)},zone:()=>{tone(523,.12,'triangle',.15);setTimeout(()=>tone(784,.2,'triangle',.15),120)},over:()=>tone(400,.5,'sawtooth',.15,100),win:()=>{tone(523,.15,'triangle',.2);setTimeout(()=>tone(659,.15,'triangle',.2),150);setTimeout(()=>tone(988,.3,'triangle',.2),300)}};
let busVoiceCooldown=0,busVoiceAudio=null,shuntAudio=null,busVoiceSource=null,shuntSource=null;
function loadBusVoice(){try{busVoiceAudio=new Audio('bus-voice.mp3');busVoiceAudio.volume=0.7;busVoiceAudio.load()}catch(e){console.error('Failed to load bus voice audio:',e)}}
function loadShuntAudio(){try{shuntAudio=new Audio('SHUNT.mp3');shuntAudio.volume=0.8;shuntAudio.load()}catch(e){console.error('Failed to load shunt audio:',e)}}
function playBusVoiceWithEffects(){
  if(!AC||!busVoiceAudio)return;
  ac();
  if(!busVoiceSource){
    const ctx=AC;
    const source=ctx.createMediaElementSource(busVoiceAudio);
    const compressor=ctx.createDynamicsCompressor();
    compressor.threshold.value=-24;compressor.knee.value=30;compressor.ratio.value=12;compressor.attack.value=0.003;compressor.release.value=0.25;
    const eq=ctx.createBiquadFilter();
    eq.type='peaking';eq.frequency.value=1000;eq.Q.value=1;eq.gain.value=3;
    const reverb=ctx.createConvolver();
    const impulseLength=ctx.sampleRate*2;
    const impulse=ctx.createBuffer(2,impulseLength,ctx.sampleRate);
    for(let c=0;c<2;c++){
      const channel=impulse.getChannelData(c);
      for(let i=0;i<impulseLength;i++){channel[i]=(Math.random()*2-1)*Math.pow(1-i/impulseLength,2)}
    }
    reverb.buffer=impulse;
    const reverbGain=ctx.createGain();reverbGain.gain.value=0.3;
    const dryGain=ctx.createGain();dryGain.gain.value=0.7;
    source.connect(compressor);compressor.connect(eq);eq.connect(dryGain);eq.connect(reverb);
    reverb.connect(reverbGain);reverbGain.connect(ctx.destination);dryGain.connect(ctx.destination);
    busVoiceSource=source;
  }
  busVoiceAudio.currentTime=0;
  busVoiceAudio.play().catch(e=>console.error('Bus voice play failed:',e));
}
function playShuntWithEffects(){
  if(!AC||!shuntAudio)return;
  ac();
  if(!shuntSource){
    const ctx=AC;
    const source=ctx.createMediaElementSource(shuntAudio);
    const compressor=ctx.createDynamicsCompressor();
    compressor.threshold.value=-20;compressor.knee.value=40;compressor.ratio.value=12;compressor.attack.value=0.003;compressor.release.value=0.25;
    const eq=ctx.createBiquadFilter();
    eq.type='peaking';eq.frequency.value=2000;eq.Q.value=1;eq.gain.value=4;
    const distortion=ctx.createWaveShaper();
    const curve=new Float32Array(2048);
    for(let i=0;i<2048;i++){const x=i*2/2047-1;curve[i]=Math.tanh(x*3)}distortion.curve=curve;
    const distortionGain=ctx.createGain();distortionGain.gain.value=0.15;
    source.connect(compressor);compressor.connect(eq);eq.connect(distortion);
    distortion.connect(distortionGain);distortionGain.connect(ctx.destination);eq.connect(ctx.destination);
    shuntSource=source;
  }
  shuntAudio.currentTime=0;
  shuntAudio.play().catch(e=>console.error('Shunt play failed:',e));
}
loadBusVoice();
loadShuntAudio();
function speak(text){if(muted||busVoiceCooldown>0)return;if(busVoiceAudio){playBusVoiceWithEffects();busVoiceCooldown=8}}
/* ---------- renderer, scene, lights ---------- */
const R=new THREE.WebGLRenderer({antialias:!touch,powerPreference:'high-performance'});R.setPixelRatio(touch?1:Math.min(devicePixelRatio,2));
R.shadowMap.enabled=!touch;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,600);
const SKY=new THREE.Color(0xf0b27a);scene.background=SKY.clone();scene.fog=new THREE.FogExp2(0xf0b27a,.006);
const hemi=new THREE.HemisphereLight(0xffe0b0,0x3a4a2a,.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc27a,1.5);sun.castShadow=!touch;const SM=touch?512:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:140});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
const torch=new THREE.SpotLight(0xfff2cc,0,45,.55,.5,1);torch.castShadow=false;scene.add(torch,torch.target);
/* ---------- physics ---------- */
const W=new CANNON.World();W.gravity.set(0,-22,0);W.broadphase=new CANNON.NaiveBroadphase();W.solver.iterations=8;
const mat=new CANNON.Material();W.addContactMaterial(new CANNON.ContactMaterial(mat,mat,{friction:.08,restitution:.25}));
const gb=new CANNON.Body({mass:0,material:mat});gb.addShape(new CANNON.Plane());gb.quaternion.setFromEuler(-Math.PI/2,0,0);W.addBody(gb);
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function mk(g,c,x,y,z,p,o){const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.05},o||{})));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}
function sbody(x,y,z,w,h,d){const b=new CANNON.Body({mass:0,material:mat});b.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));b.position.set(x,y,z);W.addBody(b);return b}
function label(txt,w,h,bg,fg){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='700 '+(h*.62)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+3);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function sign(txt,w,h,bg,fg,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:label(txt,512,Math.round(512*h/w),bg,fg)}));m.position.set(x,y,z);m.rotation.y=ry||0;scene.add(m);return m}

 picks.forEach(p=>{if(!p.on)return;p.g.rotation.y+=dt*2;p.g.position.y=1.1+Math.sin(t*3+p.g.position.z)*.15;
  const ex=p.g.position.x-pb.position.x,ez=p.g.position.z-pb.position.z;
  if(ex*ex+ez*ez<2.2&&Math.abs(pb.position.y-1)<1.6){p.on=0;p.g.visible=false;cg=Math.min(5,cg+(p.j?.15:.25));money+=p.j?50:100;sfx.good();toast((p.j?'Jollof':'Lecture notes')+'  +'+(p.j?'0.15':'0.25')+'  +₦'+(p.j?50:100),700)}});
 /* events: NEPA outage and Harmattan dust */
 if(busVoiceCooldown>0)busVoiceCooldown-=dt;
 nextEv-=dt;if(evT>0){evT-=dt;if(evT<=0)ev=0}
 if(nextEv<=0&&ev===0){evk++;ev=[1,2,3][evk%3];evT=ev===3?14:9;nextEv=34;sfx.warn();toast(ev===1?'NEPA OUTAGE':ev===2?'HARMATTAN DUST':'RAIN STORM',2200)}
 const nep=ev===1?1:0,hz2=ev===2?1:0,rn=ev===3?1:0,k=Math.min(1,dt*2.5);rainStep(dt,rn);
 lit.nepa+=(nep-lit.nepa)*k;lit.sun+=((nep?.05:hz2?.9:rn?.6:1.5)-lit.sun)*k;lit.hemi+=((nep?.1:hz2?.6:rn?.45:.65)-lit.hemi)*k;lit.fog+=((nep?.02:hz2?.05:rn?.03:.011)-lit.fog)*k;
 sun.intensity=lit.sun;hemi.intensity=lit.hemi+(bolt>0?2.5:0);scene.fog.density=lit.fog;
 /* day-to-evening cycle */
 dayTime+=dt*.02;const dayCycle=(Math.sin(dayTime)+1)/2;
 const dayColor=new THREE.Color(nep?0x080b14:hz2?0xd2aa69:rn?0x6f7f90:0xf0b27a);
 const eveColor=new THREE.Color(nep?0x080b14:hz2?0x8b4513:rn?0x2a3342:0x1a1a2e);
 const skyColor=dayColor.clone().lerp(eveColor,dayCycle);
 scene.fog.color.lerp(skyColor,k);scene.background.lerp(skyColor,k);
 lamps.forEach(m=>m.emissiveIntensity=.9*(1-lit.nepa));
 torch.intensity=3.2*lit.nepa;torch.position.set(pb.position.x,2.6,pb.position.z);torch.target.position.set(pb.position.x+Math.sin(face)*10,0,pb.position.z+Math.cos(face)*10);
 /* zones, hud */
 let z=0;while(pb.position.z<ZONES[z][0])z++;if(z!==zi){zi=z;$('zn').textContent=ZONES[z][1];toast(ZONES[z][1].toUpperCase(),2200);sfx.zone()}
 $('cgv').textContent=cg.toFixed(2);$('bar').firstChild.style.width=(cg/5*100)+'%';$('tm').textContent=fmt(Math.max(0,time));
 $('ds').textContent=Math.max(0,Math.round(pb.position.z-GOAL))+' m to lecture hall';
 /* heat and money */
 living(dt);guardsStep(dt);heat=Math.max(0,heat-dt*1.5);$('heat-meter-fill').style.width=heat+'%';$('money-display').textContent='₦'+money;
 const doorZ=GOAL-hallD/2+hallD/2;
 if(pb.position.z<doorZ+2&&Math.abs(pb.position.x)<5)finish(true);else if(time<=0)finish(false);
}
function cam3(dt){
 const d=7.5,h=3.4,tx=pl.position.x,tz=pl.position.z,ty=pl.position.y+1.5;
 const px=tx+Math.sin(yaw)*d,pz=tz+Math.cos(yaw)*d,py=ty+h;
 if(shakeIntensity>0){const sx=(Math.random()-.5)*shakeIntensity,sy=(Math.random()-.5)*shakeIntensity,sz=(Math.random()-.5)*shakeIntensity;cam.position.x+=sx;cam.position.y+=sy;cam.position.z+=sz;shakeIntensity=Math.max(0,shakeIntensity-dt*2)}
 cam.position.x+=(px-cam.position.x)*Math.min(1,dt*8);cam.position.y+=(py-cam.position.y)*Math.min(1,dt*8);cam.position.z+=(pz-cam.position.z)*Math.min(1,dt*8);
 const targetFOV=sprintOn?75:60;cam.fov+=(targetFOV-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix();
 cam.lookAt(tx,ty,tz);
 sun.position.set(tx-30,34,tz-26);sun.target.position.set(tx,0,tz);
}
const minimapCanvas=$('minimap'),minimapCtx=minimapCanvas.getContext('2d');
minimapCanvas.width=140;minimapCanvas.height=140;
let minimapPulse=0;
function renderMinimap(){
 const ctx=minimapCtx,scale=.12,center=70;
 minimapPulse+=.1;
 ctx.fillStyle='rgba(20,20,30,.9)';ctx.beginPath();ctx.arc(center,center,68,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(242,193,78,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(center,center,68,0,Math.PI*2);ctx.stroke();
 /* draw road */
 ctx.fillStyle='rgba(80,80,90,.4)';ctx.fillRect(center-2,center-68,4,136);
 /* draw zones */
 ZONES.forEach((z,i)=>{if(z[0]===-1e9)return;const zz=z[0]*scale+center;if(zz>center-68&&zz<center+68){ctx.strokeStyle='rgba(242,193,78,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(center-68,zz);ctx.lineTo(center+68,zz);ctx.stroke()}});
 const px=pb.position.x*scale+center,pz=pb.position.z*scale+center;
 ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.arc(px,pz,4,0,Math.PI*2);ctx.fill();
 /* player direction arrow */
 ctx.strokeStyle='#f2c14e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,pz);ctx.lineTo(px+Math.sin(yaw)*6,pz+Math.cos(yaw)*6);ctx.stroke();
 /* lecture hall - always show with pulsing animation */
 const gx=GOAL*scale+center,gz=GOAL*scale+center;
 const distFromCenter=Math.hypot(gx-center,gz-center);
 const pulseRadius=5+Math.sin(minimapPulse)*1.5;
 if(distFromCenter<60){
  /* pulsing ring */
  ctx.strokeStyle='rgba(39,174,96,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,gz,pulseRadius,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#27ae60';ctx.beginPath();ctx.arc(gx,gz,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='9px Inter';ctx.fillText('🎓',gx-4,gz+3);
 }else{
  const angle=Math.atan2(gz-center,gx-center);
  const ax=center+Math.cos(angle)*55,az=center+Math.sin(angle)*55;
  /* pulsing ring around arrow */
  ctx.strokeStyle='rgba(39,174,96,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax,az,pulseRadius+2,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#27ae60';ctx.beginPath();ctx.moveTo(ax,az-6);ctx.lineTo(ax+5,az+4);ctx.lineTo(ax-5,az+4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.font='9px Inter';ctx.fillText('🎓',ax-4,az+12);
 }
 /* distance text */
 const distToGoal=Math.max(0,Math.round(pb.position.z-GOAL));
 ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='10px Inter';ctx.fillText(distToGoal+'m',center-12,center+58);
 vehs.forEach(v=>{const vx=v.b.position.x*scale+center,vz=v.b.position.z*scale+center;const vDist=Math.hypot(vx-center,vz-center);if(vDist<65){ctx.fillStyle=v.hz==='Alawusa bus!'?'#1f9a4a':v.hz==='Keke!'?'#f39c12':'#e74c3c';ctx.beginPath();ctx.arc(vx,vz,3,0,Math.PI*2);ctx.fill()}});
 hz.forEach(h=>{const hx=h.b.position.x*scale+center,hz=h.b.position.z*scale+center;const hDist=Math.hypot(hx-center,hz-center);if(hDist<65){ctx.fillStyle='#9b59b6';ctx.beginPath();ctx.arc(hx,hz,2,0,Math.PI*2);ctx.fill()}});
}
function showConfetti(text){
 const confetti=document.createElement('div');
 confetti.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:100;display:flex;align-items:center;justify-content:center;font:clamp(48px,12vw,96px) var(--head);color:#f2c14e;text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:confettiPop 0.5s ease-out forwards';
 confetti.textContent=text;
 document.body.appendChild(confetti);
 const canvas=document.createElement('canvas');
 canvas.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';
 document.body.appendChild(canvas);
 const ctx=canvas.getContext('2d');
 canvas.width=innerWidth;canvas.height=innerHeight;
 const particles=[];
 const colors=['#f2c14e','#ff7a3d','#27ae60','#3498db','#9b59b6'];
 for(let i=0;i<150;i++){
  particles.push({
   x:innerWidth/2,y:innerHeight/2,
   vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20-10,
   size:Math.random()*8+4,color:colors[Math.floor(Math.random()*colors.length)],
   rotation:Math.random()*Math.PI*2,rotationSpeed:(Math.random()-0.5)*0.3
  });
 }
 let startTime=performance.now();
 function animate(now){
  const elapsed=(now-startTime)/1000;
  if(elapsed>3){confetti.remove();canvas.remove();return}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
   p.x+=p.vx;p.y+=p.vy;p.vy+=0.5;p.rotation+=p.rotationSpeed;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);
   ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
   ctx.restore();
  });
  requestAnimationFrame(animate);
 }
 requestAnimationFrame(animate);
 const style=document.createElement('style');
 style.textContent='@keyframes confettiPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}';
 document.head.appendChild(style);
}
let last=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(run&&!over){try{update(dt)}catch(e){console.error('update error',e)}}else if(!run){yaw+=dt*.12;pl.position.set(pb.position.x,.5,pb.position.z)}
 cam3(dt);renderMinimap();R.render(scene,cam)}
function finish(win){over=true;run=false;let c=cg;if(win)c=Math.min(5,cg+Math.max(0,time)/TIME0*.5);c=+c.toFixed(2);sfx[win?'win':'over']();
 saveScore(c,Math.max(0,time),win);
 let best=0;try{best=+localStorage.getItem('fd3Best')||0;if(c>best){localStorage.setItem('fd3Best',c);best=c}}catch(e){}
 ov.style.display='flex';
 if(win)completeMission('Reach Class Before 8am');
 if(win&&c>=4.5)showConfetti('SCHOLAR!!!');
 ov.innerHTML='<div class="card c"><div class="ey">'+(win?'You made it to class':'Late for the 8am lecture')+'</div><div class="big">'+c.toFixed(2)+'</div><h1 style="font-size:34px">'+cls(c)+'</h1><p class="sub">Best: '+best.toFixed(2)+' / 5.00'+(playerDept?' &middot; '+DEPT_NAMES[playerDept]||playerDept+' ('+FACULTIES[playerFaculty]?.name+')':'')+'</p><button id="again">Run again</button><button class="alt" id="share">Share result</button><button class="alt" id="leaderboard">Leaderboard</button></div>';
 $('again').onclick=()=>location.reload();
 $('share').onclick=async()=>{const s=(playerName?playerName+' ('+(DEPT_NAMES[playerDept]||playerDept)+'): ':'')+'I finished FUTMINNA Dash 3D with a '+c.toFixed(2)+' CGPA ('+cls(c)+'). Can you beat me? Created by Joy Auta: '+location.href;
  try{if(navigator.share)await navigator.share({text:s});else{await navigator.clipboard.writeText(s);$('share').textContent='Copied. Paste it on WhatsApp'}}catch(e){}};
 $('leaderboard').onclick=async()=>{const lb=await getLeaderboard(playerFaculty,playerDept);showLeaderboard(lb,playerFaculty,playerDept)}}
function showLeaderboard(lb,faculty,dept){const title=dept?DEPT_NAMES[dept]+' Leaderboard':faculty?FACULTIES[faculty]?.name+' Leaderboard':'Overall Leaderboard';const rows=lb.slice(0,10).map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+e.name+'</td><td>'+Number(e.cgpa).toFixed(2)+'</td><td>'+(DEPT_NAMES[e.department]||e.department)+'</td></tr>').join('');
 ov.innerHTML='<div class="card"><h2>'+title+'</h2><table style="width:100%;text-align:left;border-collapse:collapse;font:13px var(--body)"><thead><tr><th>#</th><th>Name</th><th>CGPA</th><th>Department</th></tr></thead><tbody>'+rows+'</tbody></table><button id="closeLB">Close</button></div>';
 $('closeLB').onclick=()=>location.reload()}
function begin(){playerName=$('pname').value.trim();playerFaculty=$('pfaculty').value;playerDept=$('pdept').value;if(!playerName){alert('Please enter your name');return}if(!playerFaculty||!playerDept){alert('Please select your faculty and department');return}ac();ov.style.display='none';run=true;t=0;toast('RUN TO THE LECTURE HALL',2200);$('zn').textContent=ZONES[0][1];showMission('Reach Class Before 8am','Run from Gidan Kwano to the lecture hall before time runs out. Avoid vehicles and collect jollof for CGPA!')}

 ov.innerHTML='<div class="card"><div><div class="ey">Technology for Empowerment</div><h1>FUTMINNA<br>Dash 3D</h1></div>'+
