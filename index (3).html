<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUTMINNA Dash</title>
<meta name="author" content="Joy Auta">
<meta name="copyright" content="© 2026 Joy Auta. All rights reserved.">
<meta name="description" content="FUTMINNA Dash: a campus runner game for FUT Minna students. Created by Joy Auta.">
<meta property="og:title" content="FUTMINNA Dash">
<meta property="og:description" content="Run from Gidan Kwano to Bosso, ride Alawusa, survive the shunt and graduate with a First Class CGPA. Created by Joy Auta.">
<meta property="og:type" content="website">
<!-- FUTMINNA Dash. Created by Joy Auta. Copyright 2026. All rights reserved. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#07060c;--panel:rgba(12,10,18,.94);--line:#ff7a3d;--ink:#f4f1ea;--muted:#a9a6b3;--gold:#f2c14e;--green:#35c27a;--red:#e5534b;--head:Anton,Impact,'Arial Narrow',sans-serif;--body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1020,#07060c 70%)}
#stage{position:relative;flex:none;box-shadow:0 0 0 2px #000,0 20px 60px rgba(0,0,0,.6)}
#side{display:none;width:260px;flex:none;margin-right:44px;flex-direction:column;gap:14px}
@media (min-width:1000px) and (min-height:600px){#side{display:flex}}
canvas{width:100%;height:100%;display:block;background:#222}
#ov{position:absolute;inset:0;display:flex;overflow-y:auto;background:rgba(8,6,14,.9);padding:16px;box-sizing:border-box}
.card{margin:auto;width:100%;max-width:330px;background:var(--panel);border:2px solid var(--line);border-radius:6px;box-shadow:6px 6px 0 #000;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{margin:0;font-family:var(--head);font-weight:400;font-size:clamp(36px,11vw,58px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;transform:skewX(-8deg);transform-origin:left;background:linear-gradient(180deg,#ffe27a,#ff7a3d 55%,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000)}
h2{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
li{display:flex;gap:9px;align-items:baseline;line-height:1.35}
li i{flex:none;width:8px;height:8px;background:var(--green);outline:1px solid #000}
li.bad i{background:var(--red)}
li b{font-weight:700}
li span{color:var(--muted)}
button{font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid #000;border-radius:4px;padding:13px 18px;background:linear-gradient(180deg,#ffd35a,#ff9a3d);color:#1b0f00;cursor:pointer;width:100%;box-shadow:3px 3px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.alt{background:#181820;color:var(--ink);border:2px solid #3a3946;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:auto;padding:6px 11px;font-size:11px;letter-spacing:.05em}
.chip.on{background:linear-gradient(180deg,#ffd35a,#ff9a3d);color:#1b0f00;border-color:#000}
.big{font-family:var(--head);font-size:clamp(60px,20vw,88px);line-height:1;color:var(--gold);-webkit-text-stroke:3px #000;paint-order:stroke fill;filter:drop-shadow(4px 4px 0 #000)}
.center{text-align:center}
.center h1{transform:none;filter:drop-shadow(3px 3px 0 #000)}
.hint{font-size:12px;color:var(--muted);text-align:center}
#mute{position:absolute;right:10px;bottom:10px;width:auto;padding:6px 12px;font-size:11px;z-index:5;background:rgba(8,6,14,.85)}
</style>
</head>
<body>
<div id="wrap"><aside id="side"><div><h2>Controls</h2><ul><li><i></i><span><b>Left / Right arrow</b> or <b>A / D</b> to change lane</span></li><li><i></i><span><b>Tap</b> the left or right side of the screen on a phone</span></li></ul></div><div class="hint" style="text-align:left">Created by Joy Auta<br>&copy; 2026 All rights reserved<br><br>Independent student project. Not affiliated with or endorsed by FUT Minna.</div></aside><div id="stage">
<canvas id="c" width="360" height="640"></canvas>
<div id="ov"></div>
<button id="mute" class="alt">Sound: on</button>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const W=360,LX=i=>60+i*120;let H=640,PY=530,K=1;
const STAGES=['Gidan Kwano','Gidan Kwano Bus Park','Bosso Campus','Bosso Bus Park'];
const ACC=['#35c27a','#e0b020','#3fa0d0','#e07a2a'];
const ROAD=['#33363d','#30383f','#403a35','#3c343f'];
const SCHOOLS=['SAMET','SAFT','SAT','SICT','SIPET','SIT','SLS','SPS','SSTE','SPhS','SAAT'];
const HEAD='Anton,Impact,"Arial Narrow",sans-serif';
let school='',s,last=0,best=0;
try{best=+localStorage.getItem('fdBest')||0}catch(e){}
const GOOD=[
 {id:'jollof',n:'Jollof',cg:.04,w:5},
 {id:'notes',n:'Lecture notes',cg:.12,w:4},
 {id:'power',n:'Power bank',cg:.03,w:2,life:1},
 {id:'radio',n:'Search FM 92.3',cg:.03,w:2,radio:1},
 {id:'bus',n:'Alawusa ride',cg:.05,w:2,ride:1}];
const BAD=[
 {id:'okada',n:'Okada'},
 {id:'puddle',n:'Puddle'},
 {id:'lecturer',n:'Attendance check'},
 {id:'shunt',n:'Shunt! Pushed aside',shunt:1},
 {id:'keke',n:'Keke'},
 {id:'goat',n:'Goat on the road'}];

/* ---------- sound (Web Audio, no files needed) ---------- */
let AC,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,f2){if(muted||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
const SFX={good:()=>tone(660,.12,'triangle',.18,990),hit:()=>tone(160,.3,'sawtooth',.2,60),ride:()=>{tone(392,.15,'square',.08);setTimeout(()=>tone(523,.2,'square',.08),130)},tick:()=>tone(520,.1,'square',.1),go:()=>tone(880,.25,'square',.12),warn:()=>{tone(300,.2,'square',.08);setTimeout(()=>tone(300,.2,'square',.08),250)},stage:()=>{tone(523,.12,'triangle',.15);setTimeout(()=>tone(784,.2,'triangle',.15),120)},over:()=>tone(400,.5,'sawtooth',.15,100)};
const sfx=n=>{try{SFX[n]()}catch(e){}};
document.getElementById('mute').onclick=e=>{ac();muted=!muted;e.target.textContent='Sound: '+(muted?'off':'on')};

/* ---------- sprites: top-down, outlined, shaded ---------- */
const OUT='rgba(8,8,10,.85)';
const E=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=OUT;ctx.stroke()};
const C=(x,y,r,c)=>E(x,y,r,r,c);
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);ctx.lineWidth=1.5;ctx.strokeStyle=OUT;ctx.strokeRect(x,y,w,h)};
const N=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
/* pedestrian: shoulders, arms, head, hair. a = arm height (negative = reaching forward) */
const P=(x,y,sh,sk,hr,a)=>{a=a===undefined?4:a;E(x,y+4,13,7.5,sh);C(x-14,y+a,3.8,sk);C(x+14,y+a,3.8,sk);C(x,y-2,7.5,sk);E(x,y-4,6.8,5.2,hr)};
function drawBus(x,y,k){ctx.save();ctx.translate(x,y);ctx.scale(k,k);
 N(-29,-26,5,16,'#0b0b0b');N(24,-26,5,16,'#0b0b0b');N(-29,16,5,16,'#0b0b0b');N(24,16,5,16,'#0b0b0b');
 R(-25,-40,50,80,'#1f9a4a');N(-21,-26,42,58,'#27b85c');
 N(-21,-9,42,2,'#17803a');N(-21,13,42,2,'#17803a');
 N(-21,-38,42,9,'#bfe9ff');N(-21,31,42,5,'#8cc7e8');
 N(-22,-42,7,3,'#ffe27a');N(15,-42,7,3,'#ffe27a');
 N(-29,-32,4,6,'#111');N(25,-32,4,6,'#111');
 ctx.fillStyle='#fff';ctx.font='700 10px Inter,system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ALAWUSA',0,2);ctx.restore()}
const SPR={
 jollof:()=>{C(0,0,23,'#f4f4ee');C(0,0,16,'#d9481c');[[-6,-5],[5,-8],[8,3],[-4,7],[0,-1]].forEach(p=>C(p[0],p[1],2.4,'#f5953f'))},
 notes:()=>{R(-16,-22,32,44,'#2b6cb0');N(-16,-22,6,44,'#1e4e82');[-12,-4,4].forEach(y=>N(-5,y,17,2,'#e8f0ff'))},
 power:()=>{R(-13,-22,26,44,'#1f2a35');N(-8,-16,16,6,'#35c27a');
  ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.moveTo(2,-4);ctx.lineTo(-6,8);ctx.lineTo(0,8);ctx.lineTo(-2,20);ctx.lineTo(8,4);ctx.lineTo(2,4);ctx.closePath();ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=OUT;ctx.stroke()},
 radio:()=>{ctx.strokeStyle='#bbb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,-15);ctx.lineTo(22,-32);ctx.stroke();
  R(-23,-15,46,32,'#3a3f4a');C(-8,2,9,'#16181d');N(6,-8,14,8,'#35c27a');N(6,5,14,3,'#8a8f99')},
 bus:()=>drawBus(0,0,.85),
 okada:()=>{N(-2.5,-34,5,16,'#0b0b0b');N(-2.5,18,5,16,'#0b0b0b');R(-5,-16,10,34,'#c0392b');R(-17,-22,34,4,'#222');N(-20,-26,4,6,'#111');N(16,-26,4,6,'#111');P(0,6,'#2d3748','#8d5524','#e8e8e8',-14)},
 puddle:()=>{ctx.fillStyle='rgba(55,125,185,.88)';ctx.beginPath();ctx.ellipse(0,0,34,18,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(160,210,245,.55)';ctx.beginPath();ctx.ellipse(-7,-3,19,8,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,26,12,0,0,7);ctx.stroke()},
 lecturer:()=>{R(12,-8,13,19,'#f1f1f1');N(12,-8,13,3,'#e5534b');N(14,-2,9,1.5,'#999');N(14,3,9,1.5,'#999');P(0,2,'#1b1f27','#8d5524','#bdbdbd')},
 keke:()=>{N(-3,-37,6,12,'#0b0b0b');N(-30,6,7,17,'#0b0b0b');N(23,6,7,17,'#0b0b0b');R(-21,-27,42,55,'#f2c14e');R(-17,-9,34,36,'#222');N(-17,-9,34,3,'#4a4a4a');N(-14,-23,28,9,'#bfe9ff');N(-3,-30,6,3,'#fffbd0')},
 goat:()=>{[[-16,-4],[12,-4],[-16,12],[12,12]].forEach(p=>R(p[0],p[1],4,9,'#4a3b2e'));E(0,6,12,22,'#e8e2d6');C(0,-22,8,'#d9d2c3');
  ctx.strokeStyle='#4a3a2c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-5,-28);ctx.lineTo(-9,-36);ctx.moveTo(5,-28);ctx.lineTo(9,-36);ctx.stroke()},
 shunt:()=>{P(-17,8,'#b83a3a','#8d5524','#222',-8);P(17,8,'#d17a22','#6b3f1d','#111',-8);P(0,-8,'#7a2f8f','#c68642','#222',-8)},
 player:()=>{ctx.fillStyle='rgba(242,193,78,.22)';ctx.beginPath();ctx.arc(0,2,31,0,7);ctx.fill();R(-9,5,18,15,'#1f2a35');P(0,2,'#f2c14e','#8d5524','#111')}
};
function shadowed(fn){ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowOffsetX=5*K;ctx.shadowOffsetY=7*K;fn();ctx.restore()}
const tex=document.createElement('canvas');tex.width=W;tex.height=60;
(()=>{const t=tex.getContext('2d');for(let i=0;i<420;i++){t.fillStyle=Math.random()<.5?'rgba(0,0,0,.16)':'rgba(255,255,255,.07)';t.fillRect(Math.random()*W,Math.random()*60,1+Math.random()*2,1+Math.random()*2)}
 t.strokeStyle='rgba(0,0,0,.2)';t.lineWidth=1;[[40,10,90,18],[250,40,300,34]].forEach(c=>{t.beginPath();t.moveTo(c[0],c[1]);t.lineTo(c[2],c[3]);t.stroke()})})();
function ot(t,x,y,fill){ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y)}

/* ---------- game logic ---------- */
function reset(){s={run:true,cd:3,lane:1,x:LX(1),items:[],t:0,sp:0,lives:3,cg:0,dark:0,nextDark:20,pop:[],road:0,flash:0,combo:0,banner:0,radio:0,ride:0,haze:0,ev:0,stage:0,bt:''}}
function cls(c){return c>=4.5?'First Class':c>=3.5?'Second Class Upper':c>=2.4?'Second Class Lower':c>=1.5?'Third Class':'Carryover. Try again'}
function pick(a){let t=a.reduce((x,y)=>x+(y.w||1),0),r=Math.random()*t;for(const o of a){r-=(o.w||1);if(r<=0)return o}return a[0]}
function pb(){return s.stage%2===1&&Math.random()<.4?BAD[3]:pick(BAD)}
function spawn(){
  const L=[0,1,2].sort(()=>Math.random()-.5);
  if(Math.random()<.35){s.items.push({l:L[0],y:-60,o:pb(),bad:1},{l:L[1],y:-60,o:pb(),bad:1},{l:L[2],y:-60,o:pick(GOOD),bad:0})}
  else{const bad=Math.random()<.55;s.items.push({l:L[0],y:-60,o:bad?pb():pick(GOOD),bad:bad?1:0})}
}
function pop(t,x,y,c){s.pop.push({t,x,y,c,life:1})}
function hit(it){
  if(it.bad){
    if(s.ride>0){pop('Protected',s.x,PY-55,'#7ee0ff');return}
    s.lives--;
    if(it.o.shunt)s.lane=Math.max(0,Math.min(2,s.lane+(Math.random()<.5?-1:1)));
    sfx('hit');s.combo=0;s.cg=Math.max(0,s.cg-.1);s.flash=.35;pop(it.o.n+'  -1 life',s.x,PY-55,'#ff7a7a');
    try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
    if(s.lives<=0)end();
  }else{
    sfx('good');s.combo++;s.cg=Math.min(5,s.cg+it.o.cg*(1+Math.min(s.combo,10)*.1));
    if(it.o.life&&s.lives<3)s.lives++;
    if(it.o.ride){sfx('ride');s.ride=4;s.banner=2.5;s.bt='ALAWUSA RIDE: SAFE BUT SLOW'}
    if(it.o.radio){s.radio=6;s.banner=2.5;s.bt='SEARCH FM 92.3: ROAD SLOWED'}
    pop(it.o.n+(s.combo>2?'  x'+s.combo:''),s.x,PY-55,'#f2c14e');
  }
}
function end(){
  s.run=false;sfx('over');const c=+s.cg.toFixed(2);const nb=c>best;
  if(nb){best=c;try{localStorage.setItem('fdBest',c)}catch(e){}}
  ov.style.display='flex';
  ov.innerHTML=`<div class="card center"><div class="eyebrow">Final result</div><div class="big">${c.toFixed(2)}</div>
  <h1 style="font-size:36px">${cls(c)}</h1>
  <p class="sub">${nb&&c>0?'New personal best. ':''}Best: ${best.toFixed(2)} / 5.00${school?' &middot; '+school:''}</p>
  <button id="again">Run again</button><button class="alt" id="share">Share result</button></div>`;
  document.getElementById('again').onclick=start;
  document.getElementById('share').onclick=async()=>{
    const t=`${school?school+' student: ':''}I finished FUTMINNA Dash with a ${c.toFixed(2)} CGPA (${cls(c)}). Can you beat me? Play FUTMINNA Dash by Joy Auta: https://futminnadash.netlify.app`;
    try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);document.getElementById('share').textContent='Copied. Paste it on WhatsApp'}}catch(e){}
  };
}
function start(){ac();reset();ov.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function menu(){
  ov.innerHTML=`<div class="card">
  <div><div class="eyebrow">Technology for Empowerment</div><h1>FUTMINNA<br>Dash</h1></div>
  <p class="sub">It is 7:55am and your 8am lecture is across campus. Run from Gidan Kwano to Bosso, through both bus parks, and finish with a First Class CGPA.</p>
  <div><h2>Collect</h2><ul>
   <li><i></i><span><b>Jollof</b> and <b>lecture notes</b> raise your CGPA</span></li>
   <li><i></i><span><b>Power bank</b> restores a life</span></li>
   <li><i></i><span><b>Search FM 92.3</b> slows the road</span></li>
   <li><i></i><span><b>Alawusa</b>, the green bus: no hits, but slow</span></li></ul></div>
  <div><h2>Avoid</h2><ul>
   <li class="bad"><i></i><span><b>Okada</b>, <b>keke</b>, <b>puddles</b> and <b>goats</b></span></li>
   <li class="bad"><i></i><span><b>Lecturers</b> on attendance duty</span></li>
   <li class="bad"><i></i><span>The <b>shunt</b>: pushes you sideways, worst at the bus parks</span></li>
   <li class="bad"><i></i><span><b>NEPA outages</b> and <b>Harmattan dust</b></span></li></ul></div>
  <div><h2>Your school</h2><div class="chips">${SCHOOLS.map(x=>`<button class="alt chip" data-s="${x}">${x}</button>`).join('')}</div></div>
  <button id="go">Start</button>
  <div class="hint">Tap left or right of the screen, or use the arrow keys. Best: ${best.toFixed(2)}</div><div class="hint">Created by Joy Auta &middot; &copy; 2026 All rights reserved</div><div class="hint">An independent student project. Not affiliated with or endorsed by FUT Minna.</div></div>`;
  document.getElementById('go').onclick=start;
  document.querySelectorAll('.chip').forEach(b=>{if(b.dataset.s===school)b.classList.add('on');b.onclick=()=>{school=b.dataset.s;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))}});
}
function move(d){if(!s||!s.run)return;s.lane=Math.max(0,Math.min(2,s.lane+d))}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)});
function loop(now){
  if(!s.run)return;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(s.cd>0){const pv=Math.ceil(s.cd);s.cd-=dt;if(s.cd>0&&Math.ceil(s.cd)!==pv)sfx('tick');if(s.cd<=0)sfx('go');
    draw();const n=Math.ceil(s.cd);if(n>0){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='140px '+HEAD;ot(String(n),W/2,250,'#f2c14e')}
    requestAnimationFrame(loop);return}
  s.t+=dt;const sp=Math.min(640,260+s.t*7)*(s.radio>0?.72:1)*(s.ride>0?.7:1);
  s.x+=(LX(s.lane)-s.x)*Math.min(1,dt*16);
  s.road=(s.road+sp*dt)%60;
  s.sp-=dt;if(s.sp<=0){spawn();s.sp=Math.max(.42,.95-s.t*.008)}
  for(const it of s.items){it.y+=sp*dt*(it.o.ride?.6:1);
    if(!it.done&&it.l===s.lane&&Math.abs(it.y-PY)<38){it.done=1;hit(it)}}
  s.items=s.items.filter(i=>i.y<H+70&&!i.done);
  s.nextDark-=dt;
  if(s.nextDark<=0&&s.dark<=0&&s.haze<=0){s.ev++;sfx('warn');if(s.ev%2){s.dark=5;s.bt='NEPA OUTAGE'}else{s.haze=6;s.bt='HARMATTAN DUST'}s.banner=2.5;s.nextDark=22}
  const st=Math.floor(s.t/30)%4;if(st!==s.stage){s.stage=st;sfx('stage');s.banner=2.5;s.bt=STAGES[st].toUpperCase()}
  if(s.dark>0)s.dark-=dt;if(s.radio>0)s.radio-=dt;if(s.ride>0)s.ride-=dt;if(s.haze>0)s.haze-=dt;if(s.banner>0)s.banner-=dt;if(s.flash>0)s.flash-=dt;
  for(const p of s.pop){p.y-=40*dt;p.life-=dt*1.1}s.pop=s.pop.filter(p=>p.life>0);
  draw();if(s.run)requestAnimationFrame(loop);
}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  /* road */
  ctx.fillStyle=ROAD[s.stage];ctx.fillRect(0,0,W,H);
  for(let y=-60+s.road;y<H;y+=60)ctx.drawImage(tex,0,y);
  ctx.fillStyle='rgba(255,255,255,.4)';
  for(let l=1;l<3;l++)for(let y=-60+s.road;y<H;y+=60)ctx.fillRect(l*120-1.5,y,3,30);
  /* sidewalks and curbs */
  N(0,0,12,H,'#8d887a');N(W-12,0,12,H,'#8d887a');
  for(let y=-60+s.road;y<H;y+=60){N(0,y,12,2,'rgba(0,0,0,.25)');N(W-12,y,12,2,'rgba(0,0,0,.25)')}
  N(12,0,4,H,ACC[s.stage]);N(W-16,0,4,H,ACC[s.stage]);N(16,0,2,H,'rgba(0,0,0,.45)');N(W-18,0,2,H,'rgba(0,0,0,.45)');
  /* objects */
  for(const it of s.items){ctx.save();ctx.translate(LX(it.l),it.y);
    if(!it.bad){const r=36+3*Math.sin(s.t*6+it.y/30);ctx.fillStyle='rgba(255,214,90,.14)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle='rgba(255,214,90,.85)';ctx.lineWidth=2;ctx.stroke()}
    if(it.o.id!=='puddle'){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowOffsetX=5*K;ctx.shadowOffsetY=7*K}
    SPR[it.o.id]();ctx.restore()}
  shadowed(()=>{if(s.ride>0)drawBus(s.x,PY,1.05);else{ctx.save();ctx.translate(s.x,PY);SPR.player();ctx.restore()}});
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of s.pop){ctx.globalAlpha=Math.max(0,p.life);ctx.font='700 14px Inter,system-ui';ot(p.t,Math.max(85,Math.min(W-85,p.x)),p.y,p.c);ctx.globalAlpha=1}
  /* colour grade and vignette */
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,110,60,.12)');g.addColorStop(1,'rgba(110,40,160,.2)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W/2,H/2,200,W/2,H/2,430);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* events */
  if(s.dark>0){const a=Math.min(.94,s.dark*1.5);g=ctx.createRadialGradient(s.x,PY-60,25,s.x,PY-60,150);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(s.haze>0){const a=Math.min(.7,s.haze*1.2);g=ctx.createRadialGradient(s.x,PY-60,60,s.x,PY-60,260);
    g.addColorStop(0,'rgba(214,170,105,'+a*.35+')');g.addColorStop(1,'rgba(214,170,105,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(s.flash>0){ctx.fillStyle='rgba(255,60,60,'+s.flash+')';ctx.fillRect(0,0,W,H)}
  /* HUD */
  g=ctx.createLinearGradient(0,0,0,80);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,80);
  ctx.textAlign='left';ctx.font='700 10px Inter,system-ui';ot('CGPA',14,14,'#fff');
  ctx.font='32px '+HEAD;ot(s.cg.toFixed(2),14,37,'#f2c14e');
  N(14,54,120,7,'rgba(0,0,0,.6)');N(14,54,120*s.cg/5,7,'#f2c14e');ctx.lineWidth=1.5;ctx.strokeStyle='#000';ctx.strokeRect(14,54,120,7);
  ctx.textAlign='center';ctx.font='700 11px Inter,system-ui';ot(STAGES[s.stage].toUpperCase(),W/2+30,16,'#fff');
  ctx.font='700 10px Inter,system-ui';ot('BEST '+best.toFixed(2),W/2+30,32,'#cfd8d2');
  ctx.textAlign='right';ctx.font='700 10px Inter,system-ui';ot('LIVES',W-14,14,'#fff');
  for(let i=0;i<3;i++){R(W-14-(3-i)*20+4,24,16,10,i<s.lives?'#e5534b':'rgba(255,255,255,.2)')}
  ctx.textAlign='left';ctx.font='600 9px Inter,system-ui';ot('FUTMINNA DASH BY JOY AUTA',10,H-10,'rgba(255,255,255,.75)');
  if(s.banner>0){ctx.textAlign='center';ctx.font='28px '+HEAD;ot(s.bt,W/2,105,'#ff7a3d')}
}
/* ---------- responsive fit: phones, tablets and desktop ---------- */
const wrap=document.getElementById('wrap'),side=document.getElementById('side'),stageEl=document.getElementById('stage');
function fit(){
  const sd=getComputedStyle(side).display!=='none'?side.offsetWidth+44:0;
  const vw=Math.max(200,wrap.clientWidth-sd),vh=Math.max(300,wrap.clientHeight);
  H=Math.round(Math.max(560,Math.min(760,W*vh/vw)));PY=H-110;
  const sc=Math.min(vw/W,vh/H),dpr=Math.min(2,window.devicePixelRatio||1);
  stageEl.style.width=Math.floor(W*sc)+'px';stageEl.style.height=Math.floor(H*sc)+'px';
  cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);K=cv.width/W;
  if(s)draw();
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();
menu();
</script>
