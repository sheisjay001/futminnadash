<style>

canvas{display:block}

.lb{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(242,193,78,.85)}
#jump{display:none;position:absolute;right:26px;bottom:50px;width:84px;height:84px;border-radius:50%;background:rgba(242,193,78,.8);border:2px solid #000;color:#1b0f00;font:700 13px var(--body);letter-spacing:.08em;pointer-events:auto;touch-action:none}

#sprint.fast{background:rgba(255,100,50,.9)}
.touch #joy,.touch #jump,.touch #sprint{display:block}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;background:rgba(8,6,14,.88);padding:16px;box-sizing:border-box;z-index:5}
.card{margin:auto;width:100%;max-width:380px;background:rgba(12,10,18,.96);border:2px solid #ff7a3d;border-radius:6px;box-shadow:6px 6px 0 #000;padding:22px 20px;display:flex;flex-direction:column;gap:13px;box-sizing:border-box}
.ey{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{margin:0;font:clamp(36px,10vw,56px)/.92 var(--head);text-transform:uppercase;background:linear-gradient(180deg,#ffe27a,#ff7a3d 55%,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000)}
h2{margin:0 0 5px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.sm{font-size:12px;color:var(--muted);text-align:center}
button{font:700 14px var(--body);letter-spacing:.08em;text-transform:uppercase;border:2px solid #000;border-radius:4px;padding:13px 18px;background:linear-gradient(180deg,#ffd35a,#ff9a3d);color:#1b0f00;cursor:pointer;width:100%;box-shadow:3px 3px 0 #000}
button.alt{background:#181820;color:#f4f1ea;border:2px solid #3a3946;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:auto;padding:6px 11px;font-size:11px}
.chip.on{background:linear-gradient(180deg,#ffd35a,#ff9a3d);color:#1b0f00;border-color:#000}
.big{font:76px/1 var(--head);color:var(--gold);text-align:center;text-shadow:3px 3px 0 #000}
.c{text-align:center}
</style>

<script>
const $=i=>document.getElementById(i),ov=$('ov');
if(typeof THREE==='undefined'||typeof CANNON==='undefined'){ov.innerHTML='<div class="card"><h1>Offline</h1><p class="sub">The 3D engine could not load. Check your internet connection and refresh.</p></div>';throw new Error('libs')}
const touch=matchMedia('(pointer:coarse)').matches;if(touch)document.body.classList.add('touch');
const FACULTIES={
  SAFT:{name:'School of Agricultural Management & Extension Technology',depts:['AEC','AEX','AGB']},
  SAAT:{name:'School of Agriculture and Agricultural Technology',depts:['CRP','FWT','HRT','SLM','APT','FST','WAF']},
  SAT:{name:'School of Architectural Technology',depts:['ARC','FDA','IAD','LSA']},
  SEET:{name:'School of Electrical Engineering & Technology',depts:['CPE','EEE','MCE','TME']},
  SET:{name:'School of Environmental Technology',depts:['BDT','EMV','QTS','SVG','URP']},
  SICT:{name:'School of Information & Communication Technology',depts:['AIN','CPT','CSS','DTS','IFT','IMS','ISS','SWE']},
  SIPET:{name:'School of Infrastructure, Process Engineering & Technology',depts:['ABE','CHE','CIE','FDE','MEE','MME','MNE','NCE','PGE']},
  SIT:{name:'School of Innovative Technology',depts:['EBS','FIT','LSM','LTT']},
  SLS:{name:'School of Life Sciences',depts:['BIO','MBT','MIC','BCH','PBG','ZOO','BOT']},
  SPS:{name:'School of Physical Sciences',depts:['PHY','CHM','MTS','GEL','STA','CMP','IND','OCE','ENV']},
  SSTE:{name:'School of Science & Technology Education',depts:['EDU','VTE','PHE','REC']},
  SAHS:{name:'School of Allied Health Sciences',depts:['MLS','NRS']},
  SBMS:{name:'School of Basic Medical Sciences',depts:['HNA','HNP','MDS']}
};
const DEPT_NAMES={
  AEC:'Agricultural Economics',AEX:'Agricultural Extension',AGB:'Agribusiness',
  CRP:'Crop Production',FWT:'Forestry & Wildlife',HRT:'Horticulture',SLM:'Soil Science',APT:'Animal Production',FST:'Food Science',WAF:'Water Resources & Fisheries',
  ARC:'Architecture',FDA:'Furniture Design',IAD:'Interior Architecture',LSA:'Landscape Architecture',
  CPE:'Computer Engineering',EEE:'Electrical/Electronics',MCE:'Mechatronics',TME:'Telecommunication',
  BDT:'Building Technology',EMV:'Estate Management',QTS:'Quantity Surveying',SVG:'Surveying',URP:'Urban & Regional Planning',
  AIN:'Artificial Intelligence',CPT:'Computer Science',CSS:'Cyber Security',DTS:'Data Science',IFT:'Information Technology',IMS:'Information Science',ISS:'Intelligence & Security',SWE:'Software Engineering',
  ABE:'Agricultural Engineering',CHE:'Chemical Engineering',CIE:'Civil Engineering',FDE:'Food Engineering',MEE:'Mechanical Engineering',MME:'Metallurgical Engineering',MNE:'Mining Engineering',NCE:'Nuclear Engineering',PGE:'Petroleum Engineering',
  EBS:'Entrepreneurship',FIT:'Financial Technology',LSM:'Logistics & Supply Chain',LTT:'Logistics & Transport',
  BIO:'Biology',MBT:'Microbiology',MIC:'Microbiology',BCH:'Biochemistry',PBG:'Plant Biology',ZOO:'Zoology',BOT:'Botany',
  PHY:'Physics',CHM:'Chemistry',MTS:'Mathematics',GEL:'Geology',STA:'Statistics',CMP:'Computer Science',IND:'Industrial Chemistry',OCE:'Oceanography',ENV:'Environmental Science',
  EDU:'Education',VTE:'Vocational Tech',PHE:'Physical Health',REC:'Recreation',
  MLS:'Medical Lab Science',NRS:'Nursing',HNA:'Human Anatomy',HNP:'Human Physiology',MDS:'Medicine & Surgery'
};
let playerName='',playerFaculty='',playerDept='';
const API_BASE=window.BACKEND_URL||'https://futminnadash-backend.onrender.com/api';
async function saveScore(cgpa,timeRemaining,win){if(!playerName||!playerFaculty||!playerDept)return;try{await fetch(API_BASE+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:playerName,faculty:playerFaculty,department:playerDept,cgpa:cgpa,timeRemaining:timeRemaining,win:win,timestamp:Date.now()})})}catch(e){console.error('Failed to save score:',e)}}
async function getLeaderboard(faculty,dept){try{const params=new URLSearchParams();if(faculty)params.append('faculty',faculty);if(dept)params.append('department',dept);const res=await fetch(API_BASE+'/leaderboard?'+params);const data=await res.json();return Array.isArray(data)?data:[]}catch(e){console.error('Failed to get leaderboard:',e);return[]}}
const ZONES=[[-60,'Gidan Kwano'],[-120,'Gidan Kwano Bus Park'],[-200,'Bosso Campus'],[-270,'Bosso Bus Park'],[-1e9,'Lecture Hall']];
const GOAL=-288,TIME0=130;
/* ---------- sound ---------- */
let AC,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,f2){if(muted||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
const sfx={good:()=>tone(660,.12,'triangle',.18,990),hit:()=>tone(150,.3,'sawtooth',.2,55),warn:()=>{tone(300,.2,'square',.08);setTimeout(()=>tone(300,.2,'square',.08),250)},zone:()=>{tone(523,.12,'triangle',.15);setTimeout(()=>tone(784,.2,'triangle',.15),120)},over:()=>tone(400,.5,'sawtooth',.15,100),win:()=>{tone(523,.15,'triangle',.2);setTimeout(()=>tone(659,.15,'triangle',.2),150);setTimeout(()=>tone(988,.3,'triangle',.2),300)}};
let busVoiceCooldown=0,busVoiceAudio=null,shuntAudio=null;
function loadBusVoice(){try{busVoiceAudio=new Audio('bus-voice.mp3');busVoiceAudio.volume=0.7;busVoiceAudio.load();console.log('Bus voice audio loaded successfully')}catch(e){console.error('Failed to load bus voice audio:',e)}}
function loadShuntAudio(){try{shuntAudio=new Audio('SHUNT.mp3');shuntAudio.volume=0.8;shuntAudio.load();console.log('Shunt audio loaded successfully')}catch(e){console.error('Failed to load shunt audio:',e)}}
loadBusVoice();
loadShuntAudio();
function speak(text){console.log('speak called, muted:',muted,'cooldown:',busVoiceCooldown);if(muted||busVoiceCooldown>0){console.log('speak blocked - muted or cooldown');return}if(busVoiceAudio){busVoiceAudio.currentTime=0;busVoiceAudio.play().then(()=>console.log('Bus voice playing')).catch(e=>console.error('Audio play failed:',e));busVoiceCooldown=8}else{console.log('busVoiceAudio is null')}}
/* ---------- renderer, scene, lights ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,420);
const SKY=new THREE.Color(0xf0b27a);scene.background=SKY.clone();scene.fog=new THREE.FogExp2(0xf0b27a,.011);
const hemi=new THREE.HemisphereLight(0xffe0b0,0x3a4a2a,.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc27a,1.5);sun.castShadow=true;const SM=touch?1024:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-38,right:38,top:38,bottom:-38,near:1,far:140});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
const torch=new THREE.SpotLight(0xfff2cc,0,45,.55,.5,1);torch.castShadow=false;scene.add(torch,torch.target);
/* ---------- physics ---------- */
const W=new CANNON.World();W.gravity.set(0,-22,0);W.broadphase=new CANNON.NaiveBroadphase();W.solver.iterations=8;
const mat=new CANNON.Material();W.addContactMaterial(new CANNON.ContactMaterial(mat,mat,{friction:.08,restitution:.25}));
const gb=new CANNON.Body({mass:0,material:mat});gb.addShape(new CANNON.Plane());gb.quaternion.setFromEuler(-Math.PI/2,0,0);W.addBody(gb);
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function mk(g,c,x,y,z,p,o){const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.05},o||{})));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}
function sbody(x,y,z,w,h,d){const b=new CANNON.Body({mass:0,material:mat});b.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));b.position.set(x,y,z);W.addBody(b);return b}
function label(txt,w,h,bg,fg){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font='700 '+(h*.62)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+3);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function sign(txt,w,h,bg,fg,x,y,z,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:label(txt,512,Math.round(512*h/w),bg,fg)}));m.position.set(x,y,z);m.rotation.y=ry||0;scene.add(m);return m}
function person(sh,sk,hr,pack){const g=new THREE.Group();
 mk(new THREE.CylinderGeometry(.3,.34,.85,10),sh,0,1.1,0,g);mk(new THREE.SphereGeometry(.25,12,10),sk,0,1.72,0,g);
 mk(new THREE.SphereGeometry(.27,12,8,0,6.3,0,1.5),hr,0,1.75,0,g);
 g.l1=mk(new THREE.BoxGeometry(.2,.7,.22),0x20242e,-.14,.37,0,g);g.l2=mk(new THREE.BoxGeometry(.2,.7,.22),0x20242e,.14,.37,0,g);
 mk(new THREE.BoxGeometry(.14,.6,.16),sk,-.42,1.1,0,g);mk(new THREE.BoxGeometry(.14,.6,.16),sk,.42,1.1,0,g);
 if(pack)mk(new THREE.BoxGeometry(.5,.6,.25),0x1f2a35,0,1.1,-.32,g);scene.add(g);return g}
/* ---------- world ---------- */
const gr=mk(new THREE.PlaneGeometry(600,720),0x4f8040,0,0,-150);gr.rotation.x=-Math.PI/2;gr.castShadow=false;
mk(new THREE.BoxGeometry(14,.12,330),0x30343b,0,.05,-140).castShadow=false;
[-1,1].forEach(s=>{mk(new THREE.BoxGeometry(3.4,.3,330),0x9a9588,s*8.7,.15,-140);mk(new THREE.BoxGeometry(.3,.32,330),0xe0b020,s*7,.16,-140)});
for(let z=20;z>-300;z-=8)mk(new THREE.BoxGeometry(.25,.02,3.5),0xeeeeee,0,.12,z).castShadow=false;
const BCOL=[0xd9cdb4,0xc8b9a0,0xb9c4cf,0xe0c9a8,0xa9b5a2,0xcfa98a];
for(let i=0;i<30;i++){const s=i%2?1:-1,w=rnd(8,15),h=rnd(6,17),d=rnd(8,16),x=s*(rnd(17,30)+w/2),z=-rnd(0,285);
 mk(new THREE.BoxGeometry(w,h,d),BCOL[i%6],x,h/2,z);mk(new THREE.BoxGeometry(w+.4,.6,d+.4),0x555a63,x,h+.3,z);
 for(let r=0;r<Math.floor(h/4);r++)mk(new THREE.BoxGeometry(w*.8,1.2,.1),0x2d4257,x,2.4+r*4,z+(s>0?-d/2-.06:-d/2-.06),null,{emissive:0x1a2a3a,emissiveIntensity:.5});
 sbody(x,h/2,z,w,h,d)}
for(let i=0;i<46;i++){const s=i%2?1:-1,x=s*rnd(11,16),z=-rnd(-10,290);mk(new THREE.CylinderGeometry(.22,.3,2.6,8),0x6b4a2b,x,1.3,z);mk(new THREE.SphereGeometry(rnd(1.5,2.3),10,8),0x2f7a3a,x,3.6,z)}
const lamps=[];for(let z=10;z>-300;z-=30)[-1,1].forEach(s=>{mk(new THREE.CylinderGeometry(.08,.1,5.4,6),0x333333,s*7.6,2.7,z);lamps.push(mk(new THREE.SphereGeometry(.28,10,8),0xffe6a8,s*7.0,5.5,z,null,{emissive:0xffd27a,emissiveIntensity:.9}).material)});
mk(new THREE.BoxGeometry(40,16,14),0xcfc6b0,0,8,-306);sbody(0,8,-306,40,16,14);
sign('LECTURE HALL',14,2.6,'#103a22','#f2c14e',0,12,-298.9);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,40,24,1,true),new THREE.MeshBasicMaterial({color:0xffd24a,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}));beam.position.set(0,20,GOAL);scene.add(beam);
/* ---------- vehicles, crowds, goats, props ---------- */
const vehs=[],hz=[],dyn=[],picks=[];
function veh(type,x,z,dir,sp,hit){
 const C={keke:[1.9,1.5,2.7,0xf2c14e],okada:[.75,1.5,2.1,0xc0392b],bus:[2.9,3.2,8.6,0x1f9a4a]}[type],[w,h,l,col]=C,g=new THREE.Group();
 mk(new THREE.BoxGeometry(w,h*.62,l),col,0,h*.5,0,g);
 if(type!=='okada'){mk(new THREE.BoxGeometry(w*.92,h*.42,l*.7),type==='bus'?0x27b85c:0x222222,0,h*.86,-l*.05,g);mk(new THREE.BoxGeometry(w*.8,h*.3,.1),0xbfe9ff,0,h*.9,l*.31,g)}
 else{const p=person(0x2d3748,0x8d5524,0xe8e8e8,0);scene.remove(p);p.position.set(0,.3,-.1);g.add(p)}
 [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(a=>{const wh=mk(new THREE.CylinderGeometry(.38,.38,.28,10),0x111111,a[0]*w/2,.38,a[1]*l*.34,g);wh.rotation.z=Math.PI/2});
 [-1,1].forEach(s=>mk(new THREE.BoxGeometry(.3,.2,.1),0xfff6c9,s*w*.3,h*.38,l/2,g,{emissive:0xffe27a,emissiveIntensity:1.4}));
 if(type==='bus')[-1,1].forEach(s=>{const sg=new THREE.Mesh(new THREE.PlaneGeometry(6.4,1),new THREE.MeshBasicMaterial({map:label('ALAWUSA',512,80,'#17803a','#ffffff')}));sg.position.set(s*(w/2+.02),h*.55,0);sg.rotation.y=s*Math.PI/2;g.add(sg)});
 g.rotation.y=dir>=0?0:Math.PI;scene.add(g);
 const b=new CANNON.Body({mass:0,type:CANNON.Body.KINEMATIC,material:mat});b.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,l/2)));
 b.position.set(x,h/2,z);b.velocity.set(0,0,dir*sp);b.hz=hit||null;W.addBody(b);vehs.push({g,b,dir,sp,h,l})}
for(let i=0;i<7;i++)veh('keke',i%2?3.4:-3.4,-rnd(0,290),i%2?-1:1,rnd(6,9),'Keke!');
for(let i=0;i<5;i++)veh('okada',i%2?-1.8:1.8,-rnd(0,290),i%2?1:-1,rnd(10,13),'Okada!');
for(let i=0;i<3;i++)veh('bus',i%2?3.5:-3.5,-rnd(20,280),i%2?-1:1,3.2,'Alawusa bus!');
[-82,-98,-114,-222,-238,-254].forEach((z,i)=>{const s=i%2?1:-1;veh('bus',s*17,z,0,0,null);vehs[vehs.length-1].g.rotation.y=Math.PI/2*s})
function osc(mesh,b,cx,amp,sp,ph,name){hz.push({mesh,b,cx,amp,sp,ph});b.hz=name;W.addBody(b)}
function crowd(zc){for(let i=0;i<5;i++){const m=person([0xb83a3a,0xd17a22,0x7a2f8f,0x2f6fb8,0xc0a020][i],i%2?0x6b3f1d:0x8d5524,0x1a1a1a,0);
 const b=new CANNON.Body({mass:0,type:CANNON.Body.KINEMATIC,material:mat});b.addShape(new CANNON.Sphere(.5));b.position.set(0,.6,zc-i*5);osc(m,b,0,8.5,rnd(.7,1.1),rnd(0,6),'Shunt!')}}
crowd(-70);crowd(-205);
for(let i=0;i<8;i++){const g=new THREE.Group();mk(new THREE.BoxGeometry(.6,.75,1.2),0xe8e2d6,0,.75,0,g);mk(new THREE.BoxGeometry(.3,.35,.4),0xd9d2c3,0,1.2,.7,g);mk(new THREE.BoxGeometry(.08,.3,.08),0x4a3a2c,-.1,1.5,.7,g);mk(new THREE.BoxGeometry(.08,.3,.08),0x4a3a2c,.1,1.5,.7,g);
 [[-.2,.45],[.2,.45],[-.2,-.45],[.2,-.45]].forEach(a=>mk(new THREE.BoxGeometry(.1,.4,.1),0x4a3b2c,a[0],.2,a[1],g));scene.add(g);
 const b=new CANNON.Body({mass:0,type:CANNON.Body.KINEMATIC,material:mat});b.addShape(new CANNON.Box(new CANNON.Vec3(.35,.5,.65)));b.position.set(0,.6,-rnd(10,285));osc(g,b,rnd(-4,4),rnd(5,9),rnd(.3,.6),rnd(0,6),'Goat on the road!')}
function dynBox(mesh,x,y,z,hx,hy,hz2,m){const b=new CANNON.Body({mass:m,material:mat,linearDamping:.2,angularDamping:.2});b.addShape(new CANNON.Box(new CANNON.Vec3(hx,hy,hz2)));b.position.set(x,y,z);W.addBody(b);dyn.push({mesh,b})}
for(let i=0;i<22;i++){const x=rnd(-6,6),z=-rnd(5,280),m=mk(new THREE.ConeGeometry(.38,.9,10),0xff6a1a,x,.45,z);dynBox(m,x,.45,z,.3,.45,.3,2)}
for(let i=0;i<10;i++){const x=rnd(-8,8),z=-rnd(15,280),m=mk(new THREE.CylinderGeometry(.5,.5,1.1,12),[0x2b6cb0,0xc0392b,0x35c27a][i%3],x,.6,z);dynBox(m,x,.6,z,.5,.55,.5,8)}
/* pickups */
for(let i=0;i<48;i++){const j=i%3!==0,g=new THREE.Group();
 if(j){mk(new THREE.CylinderGeometry(.5,.5,.1,16),0xf4f4ee,0,0,0,g);mk(new THREE.CylinderGeometry(.36,.36,.16,16),0xd9481c,0,.05,0,g,{emissive:0x6a1a00,emissiveIntensity:.5})}
 else mk(new THREE.BoxGeometry(.7,.9,.2),0x2b6cb0,0,0,0,g,{emissive:0x0b2a55,emissiveIntensity:.6});
 const ring=mk(new THREE.TorusGeometry(.8,.05,6,24),0xffd24a,0,0,0,g,{emissive:0xffc400,emissiveIntensity:1});ring.rotation.x=Math.PI/2;ring.castShadow=false;
 g.position.set(rnd(-9,9),1.1,-rnd(5,285));scene.add(g);picks.push({g,j,on:1})}
/* ---------- player ---------- */
const pl=person(0xf2c14e,0x8d5524,0x111111,1),pb=new CANNON.Body({mass:60,material:mat,fixedRotation:true,linearDamping:.05});
pb.addShape(new CANNON.Sphere(.5));pb.position.set(0,1,14);W.addBody(pb);
let cg=0,time=TIME0,t=0,run=false,over=false,lh=-9,yaw=0,face=0,ev=0,evT=0,nextEv=28,evk=0,zi=0,toastT=0,sprintOn=false;
const lit={sun:1.5,hemi:.65,fog:.011,nepa:0};
pb.addEventListener('collide',e=>{if(run&&e.body.hz){if(e.body.hz==='Alawusa bus!'&&busVoiceCooldown<=0){speak('better commot for road ohh')}else{hurt(e.body.hz)}}});
function toast(m,ms){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,ms||1600)}
function hurt(n){if(t-lh<1)return;lh=t;cg=Math.max(0,cg-.1);time=Math.max(0,time-2);$('flash').style.opacity=.45;setTimeout(()=>$('flash').style.opacity=0,160);toast(n+'  -0.10 CGPA');sfx.hit();if(shuntAudio){shuntAudio.currentTime=0;shuntAudio.play().catch(e=>console.error('Shunt audio play failed:',e))}try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
/* ---------- input ---------- */
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.shiftKey)K.Shift=1;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>{K[e.code]=0;if(!e.shiftKey)K.Shift=0});
let jx=0,jz=0,jid=null,jc,jumpReq=0;const joy=$('joy'),knob=$('knob');
function jm(e){const r=jc.width/2;let dx=e.clientX-(jc.left+r),dy=e.clientY-(jc.top+r);const l=Math.hypot(dx,dy)||1,k=Math.min(l,r)/l;dx*=k;dy*=k;knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/r;jz=-dy/r}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jc=joy.getBoundingClientRect();jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jup=e=>{if(e.pointerId===jid){jid=null;jx=jz=0;knob.style.transform=''}};joy.addEventListener('pointerup',jup);joy.addEventListener('pointercancel',jup);
$('jump').addEventListener('pointerdown',e=>{e.stopPropagation();jumpReq=1});
$('sprint').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();sprintOn=!sprintOn;$('sprint').classList.toggle('fast',sprintOn);$('sprint').textContent=sprintOn?'⬆⬆':'⬆';console.log('Sprint toggled:',sprintOn)});
let dr=null;R.domElement.addEventListener('pointerdown',e=>{dr={id:e.pointerId,x:e.clientX}});
addEventListener('pointermove',e=>{if(dr&&e.pointerId===dr.id){yaw-=(e.clientX-dr.x)*.006;dr.x=e.clientX}});
addEventListener('pointerup',e=>{if(dr&&e.pointerId===dr.id)dr=null});
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?70:58;cam.updateProjectionMatrix()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));fit();
/* ---------- game loop ---------- */
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const cls=c=>c>=4.5?'First Class':c>=3.5?'Second Class Upper':c>=2.4?'Second Class Lower':c>=1.5?'Third Class':'Carryover. Try again';
function update(dt){
 t+=dt;time-=dt;
 let mx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+jx,mz=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+jz;
 if(K.KeyQ)yaw+=1.8*dt;if(K.KeyE)yaw-=1.8*dt;
 const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
 const sp=(K.ShiftLeft||K.ShiftRight||K.Shift||sprintOn?(touch?12:9.5):(touch?8:6.5)),fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 const dx=fx*mz+rx*mx,dz=fz*mz+rz*mx;
 pb.velocity.x+=(dx*sp-pb.velocity.x)*Math.min(1,dt*12);pb.velocity.z+=(dz*sp-pb.velocity.z)*Math.min(1,dt*12);
 const ground=pb.position.y<1.08;if((K.Space||jumpReq)&&ground)pb.velocity.y=8.5;jumpReq=0;
 hz.forEach(h=>{const a=t*h.sp+h.ph;h.b.position.x=h.cx+Math.sin(a)*h.amp;h.b.velocity.set(Math.cos(a)*h.amp*h.sp,0,0);h.mesh.rotation.y=Math.cos(a)>0?Math.PI/2:-Math.PI/2});
 W.step(1/60,dt,3);
 vehs.forEach(v=>{if(v.sp){if(v.dir<0&&v.b.position.z<-312)v.b.position.z=26;if(v.dir>0&&v.b.position.z>26)v.b.position.z=-312}v.g.position.set(v.b.position.x,0,v.b.position.z)});
 hz.forEach(h=>{h.mesh.position.set(h.b.position.x,h.mesh.isGroup&&h.b.shapes[0].type===CANNON.Shape.types.SPHERE?0:0,h.b.position.z);if(h.mesh.l1){h.mesh.l1.position.z=Math.sin(t*10)*.2;h.mesh.l2.position.z=-Math.sin(t*10)*.2}});
 dyn.forEach(d=>{d.mesh.position.copy(d.b.position);d.mesh.quaternion.copy(d.b.quaternion)});
 if(pb.position.x>40)pb.position.x=40;if(pb.position.x<-40)pb.position.x=-40;if(pb.position.z>26)pb.position.z=26;if(pb.position.z<-300)pb.position.z=-300;
 pl.position.set(pb.position.x,pb.position.y-.5,pb.position.z);
 if(l>.1){const tf=Math.atan2(dx,dz);let d=tf-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*12);pl.l1.position.z=Math.sin(t*12)*.25*Math.min(1,l);pl.l2.position.z=-Math.sin(t*12)*.25*Math.min(1,l)}
 pl.rotation.y=face;
 picks.forEach(p=>{if(!p.on)return;p.g.rotation.y+=dt*2;p.g.position.y=1.1+Math.sin(t*3+p.g.position.z)*.15;
  const ex=p.g.position.x-pb.position.x,ez=p.g.position.z-pb.position.z;
  if(ex*ex+ez*ez<2.2&&Math.abs(pb.position.y-1)<1.6){p.on=0;p.g.visible=false;cg=Math.min(5,cg+(p.j?.15:.25));sfx.good();toast((p.j?'Jollof':'Lecture notes')+'  +'+(p.j?'0.15':'0.25'),700)}});
 /* events: NEPA outage and Harmattan dust */
 if(busVoiceCooldown>0)busVoiceCooldown-=dt;
 nextEv-=dt;if(evT>0){evT-=dt;if(evT<=0)ev=0}
 if(nextEv<=0&&ev===0){evk++;ev=evk%2?1:2;evT=9;nextEv=34;sfx.warn();toast(ev===1?'NEPA OUTAGE':'HARMATTAN DUST',2200)}
 const nep=ev===1?1:0,hz2=ev===2?1:0,k=Math.min(1,dt*2.5);
 lit.nepa+=(nep-lit.nepa)*k;lit.sun+=((nep?.05:hz2?.9:1.5)-lit.sun)*k;lit.hemi+=((nep?.1:hz2?.6:.65)-lit.hemi)*k;lit.fog+=((nep?.02:hz2?.05:.011)-lit.fog)*k;
 sun.intensity=lit.sun;hemi.intensity=lit.hemi;scene.fog.density=lit.fog;
 const c1=new THREE.Color(nep?0x080b14:hz2?0xd2aa69:0xf0b27a);scene.fog.color.lerp(c1,k);scene.background.lerp(c1,k);
 lamps.forEach(m=>m.emissiveIntensity=.9*(1-lit.nepa));
 torch.intensity=3.2*lit.nepa;torch.position.set(pb.position.x,2.6,pb.position.z);torch.target.position.set(pb.position.x+Math.sin(face)*10,0,pb.position.z+Math.cos(face)*10);
 /* zones, hud */
 let z=0;while(pb.position.z<ZONES[z][0])z++;if(z!==zi){zi=z;$('zn').textContent=ZONES[z][1];toast(ZONES[z][1].toUpperCase(),2200);sfx.zone()}
 $('cgv').textContent=cg.toFixed(2);$('bar').firstChild.style.width=(cg/5*100)+'%';$('tm').textContent=fmt(Math.max(0,time));
 $('ds').textContent=Math.max(0,Math.round(pb.position.z-GOAL))+' m to lecture hall';
 if(pb.position.z<GOAL+3)finish(true);else if(time<=0)finish(false);
}
function cam3(dt){
 const d=7.5,h=3.4,tx=pl.position.x,tz=pl.position.z,ty=pl.position.y+1.5;
 const px=tx+Math.sin(yaw)*d,pz=tz+Math.cos(yaw)*d,py=ty+h;
 cam.position.x+=(px-cam.position.x)*Math.min(1,dt*8);cam.position.y+=(py-cam.position.y)*Math.min(1,dt*8);cam.position.z+=(pz-cam.position.z)*Math.min(1,dt*8);
 cam.lookAt(tx,ty,tz);
 sun.position.set(tx-30,34,tz-26);sun.target.position.set(tx,0,tz);
}
let last=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(run&&!over)update(dt);else if(!run){yaw+=dt*.12;pl.position.set(pb.position.x,.5,pb.position.z)}
 cam3(dt);R.render(scene,cam)}
function finish(win){over=true;run=false;let c=cg;if(win)c=Math.min(5,cg+Math.max(0,time)/TIME0*.5);c=+c.toFixed(2);sfx[win?'win':'over']();
 saveScore(c,Math.max(0,time),win);
 let best=0;try{best=+localStorage.getItem('fd3Best')||0;if(c>best){localStorage.setItem('fd3Best',c);best=c}}catch(e){}
 ov.style.display='flex';
 ov.innerHTML='<div class="card c"><div class="ey">'+(win?'You made it to class':'Late for the 8am lecture')+'</div><div class="big">'+c.toFixed(2)+'</div><h1 style="font-size:34px">'+cls(c)+'</h1><p class="sub">Best: '+best.toFixed(2)+' / 5.00'+(playerDept?' &middot; '+DEPT_NAMES[playerDept]||playerDept+' ('+FACULTIES[playerFaculty]?.name+')':'')+'</p><button id="again">Run again</button><button class="alt" id="share">Share result</button><button class="alt" id="leaderboard">Leaderboard</button></div>';
 $('again').onclick=()=>location.reload();
 $('share').onclick=async()=>{const s=(playerName?playerName+' ('+(DEPT_NAMES[playerDept]||playerDept)+'): ':'')+'I finished FUTMINNA Dash 3D with a '+c.toFixed(2)+' CGPA ('+cls(c)+'). Can you beat me? Created by Joy Auta: '+location.href;
  try{if(navigator.share)await navigator.share({text:s});else{await navigator.clipboard.writeText(s);$('share').textContent='Copied. Paste it on WhatsApp'}}catch(e){}};
 $('leaderboard').onclick=async()=>{const lb=await getLeaderboard(playerFaculty,playerDept);showLeaderboard(lb,playerFaculty,playerDept)}}
function showLeaderboard(lb,faculty,dept){const title=dept?DEPT_NAMES[dept]+' Leaderboard':faculty?FACULTIES[faculty]?.name+' Leaderboard':'Overall Leaderboard';const rows=lb.slice(0,10).map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+e.name+'</td><td>'+Number(e.cgpa).toFixed(2)+'</td><td>'+(DEPT_NAMES[e.department]||e.department)+'</td></tr>').join('');
 ov.innerHTML='<div class="card"><h2>'+title+'</h2><table style="width:100%;text-align:left;border-collapse:collapse;font:13px var(--body)"><thead><tr><th>#</th><th>Name</th><th>CGPA</th><th>Department</th></tr></thead><tbody>'+rows+'</tbody></table><button id="closeLB">Close</button></div>';
 $('closeLB').onclick=()=>location.reload()}
function begin(){playerName=$('pname').value.trim();playerFaculty=$('pfaculty').value;playerDept=$('pdept').value;if(!playerName){alert('Please enter your name');return}if(!playerFaculty||!playerDept){alert('Please select your faculty and department');return}ac();ov.style.display='none';run=true;t=0;toast('RUN TO THE LECTURE HALL',2200);$('zn').textContent=ZONES[0][1]}
function menu(){
 ov.innerHTML='<div class="card"><div><div class="ey">Technology for Empowerment</div><h1>FUTMINNA<br>Dash 3D</h1></div>'+
 '<p class="sub">It is 7:55am. Run, jump and dodge your way from Gidan Kwano to the lecture hall before 8am. Collect jollof and lecture notes to lift your CGPA.</p>'+
 '<div><h2>Controls</h2><p class="sub">'+(touch?'Left thumb: move. Drag anywhere else: look around. Jump button: jump.':'WASD or arrows: move. Shift: sprint. Space: jump. Drag the mouse or press Q / E: turn the camera.')+'</p></div>'+
 '<div><h2>Watch out for</h2><p class="sub">Keke, okada and the slow Alawusa bus. Goats on the road. The shunt at the bus parks. NEPA outages (use your torch) and Harmattan dust. Traffic cones and drums are real physics objects: knock them about.</p></div>'+
 '<div><h2>Player Registration</h2><p class="sub"><input type="text" id="pname" placeholder="Enter your name" style="width:100%;padding:10px;margin:5px 0;font:14px var(--body);border:2px solid #000;border-radius:4px;box-sizing:border-box"></p>'+
 '<p class="sub"><select id="pfaculty" style="width:100%;padding:10px;margin:5px 0;font:14px var(--body);border:2px solid #000;border-radius:4px;box-sizing:border-box"><option value="">Select Faculty</option>'+
 Object.keys(FACULTIES).map(k=>'<option value="'+k+'">'+FACULTIES[k].name+'</option>').join('')+'</select></p>'+
 '<p class="sub"><select id="pdept" style="width:100%;padding:10px;margin:5px 0;font:14px var(--body);border:2px solid #000;border-radius:4px;box-sizing:border-box" disabled><option value="">Select Department</option></select></p></div>'+
 '<button id="go">Start</button><div class="sm">Created by Joy Auta &middot; &copy; 2026 All rights reserved<br>Independent student project. Not affiliated with or endorsed by FUT Minna.</div></div>';
 $('go').onclick=begin;
 $('pfaculty').onchange=()=>{const f=$('pfaculty').value;const d=$('pdept');d.disabled=!f;d.innerHTML='<option value="">Select Department</option>'+(f?FACULTIES[f].depts.map(x=>'<option value="'+x+'">'+DEPT_NAMES[x]||x+'</option>').join(''):'')}}
menu();requestAnimationFrame(frame);
